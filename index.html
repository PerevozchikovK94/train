<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Неделя">
<meta name="theme-color" content="#FAFAF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<title>Неделя</title>
</head>
<body>
<div id="app"></div>
<form id="cmd" class="cmdbar" autocomplete="off"><div class="cmdbar-in">
  <div id="chips" class="chips-row"></div>
  <div class="cmd-row"><input id="cmdInput" enterkeyhint="send" autocapitalize="off" spellcheck="false"><button class="send" type="submit" aria-label="Отправить">↑</button></div>
</div></form>
<div id="sheet" class="sheet" hidden><button class="sheet-bg" data-a="close-sheet" aria-label="Закрыть"></button><div class="sheet-panel" id="sheetPanel" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
